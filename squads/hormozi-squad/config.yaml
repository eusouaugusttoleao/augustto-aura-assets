name: hormozi-squad
version: 0.1.0
created: 2026-05-04
domain: sales-copy / offer-design
source_mind: Alex Hormozi ($100M Offers, $100M Leads, Acquisition.com)
language: pt-BR primary / en supported

description: |
  Squad for diagnosing and rewriting offers and sales pages using Alex Hormozi's
  frameworks: Value Equation, Grand Slam Offer (M-A-G-I-C), bonus stacking,
  guarantee design, CLOSER, and the 4 lead-magnet types.

agents:
  chief: hormozi-chief
  members:
    - hormozi-offer-architect
    - hormozi-copy-surgeon

invocation:
  default: "@hormozi-chief"
  commands:
    - "*diagnose {file}"
    - "*rewrite {file}"
    - "*offer {context}"

workflows:
  diagnose:
    steps:
      - hormozi-chief.avatar_check
      - hormozi-chief.big_claim_audit
      - hormozi-chief.value_equation_pass
      - hormozi-chief.offer_stack_audit
      - hormozi-chief.voice_scan
      - hormozi-chief.objection_map
      - hormozi-chief.cta_test
  rewrite:
    extends: diagnose
    steps:
      - hormozi-offer-architect.stack_offer
      - hormozi-copy-surgeon.full_rewrite
      - hormozi-chief.final_review

memory:
  chief: .claude/agent-memory/hormozi-chief/MEMORY.md

outputs:
  default_dir: mentoria-cirurgiao-capilar/copy/
